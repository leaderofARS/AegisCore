version: '3.8'

services:
  aegiscore-node-1:
    build: .
    container_name: aegiscore-node-1
    ports:
      - "5001:5000"  # Game Client Port (Node 1)
      - "8081:8080"  # Prometheus Metrics (Node 1)
    expose:
      - "6000"       # Cluster sync port
    environment:
      - AEGISCORE_PORT=5000
      - AEGISCORE_METRICS_ENABLED=true
      - AEGISCORE_METRICS_PORT=8080
      - AEGISCORE_CLUSTER_ENABLED=true
      - AEGISCORE_CLUSTER_NODEID=node-1
      - AEGISCORE_CLUSTER_PORT=6000
      - AEGISCORE_CLUSTER_PEERS=aegiscore-node-2:6000
    networks:
      - aegis-network

  aegiscore-node-2:
    build: .
    container_name: aegiscore-node-2
    ports:
      - "5002:5000"  # Game Client Port (Node 2)
      - "8082:8080"  # Prometheus Metrics (Node 2)
    expose:
      - "6000"       # Cluster sync port
    environment:
      - AEGISCORE_PORT=5000
      - AEGISCORE_METRICS_ENABLED=true
      - AEGISCORE_METRICS_PORT=8080
      - AEGISCORE_CLUSTER_ENABLED=true
      - AEGISCORE_CLUSTER_NODEID=node-2
      - AEGISCORE_CLUSTER_PORT=6000
      - AEGISCORE_CLUSTER_PEERS=aegiscore-node-1:6000
    networks:
      - aegis-network

networks:
  aegis-network:
    driver: bridge
